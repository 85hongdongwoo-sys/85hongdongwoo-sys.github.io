<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Studio — Arttrip Studio</title><meta name="description" content="Turn public-domain masterpieces into printable calendars, cards, posters, stickers and wallpapers.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&family=Dancing+Script:wght@600&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/site.css"><link rel="stylesheet" href="/studio/studio.css">
<style>.sopts select,.sopts input,.sopts textarea{font-family:inherit}.cwrap{border-radius:var(--r)}#app{min-height:70vh}.sthead h2{font-size:clamp(30px,4vw,44px)}</style></head>
<body><header class="top"><div class="wrap bar"><a class="logo" href="/">Arttrip<span>Studio</span></a><nav><a href="/art">Art</a><a href="/shop">Shop</a><a href="/pricing">Pricing</a></nav><a class="lang" id="langlink" href="/ko">한국어</a></div></header>
<main id="app"><div class="wrap sec"><p class="small">Loading…</p></div></main>
<script src="/studio/studio.js"></script>
<script>
{
  const q = new URLSearchParams(location.search), lang = q.get('lang') === 'ko' ? 'ko' : 'en';
  if (lang === 'ko') { document.documentElement.lang = 'ko'; document.body.classList.add('ko'); document.getElementById('langlink').textContent = 'English'; document.getElementById('langlink').href = '/'; }
  const toast = (m) => { let t = document.querySelector('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast'; document.body.appendChild(t); } t.textContent = m; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 1600); };
  const unlocked = (() => { try { return !!localStorage.getItem('at_key'); } catch (e) { return false; } })();
  fetch('/api/art.json?art=' + (q.get('art') || '')).then((r) => r.json()).then((rows) => {
    const A = {}; rows.forEach((r) => { A[r.id] = { t: lang === 'ko' && r.tk ? r.tk : r.t, a: lang === 'ko' && r.ak ? r.ak : r.a, s: r.theme, w: r.w, h: r.h }; });
    window.MA = { A, ORDER: rows.map((r) => r.id), st: { unlocked }, toast, svg: (id) => '<img src="/img/' + id + '.jpg" alt="" loading="lazy">' };
    const render = () => { const h = location.hash.match(/^#\/studio\/([a-z]+)/); const app = document.getElementById('app');
      app.innerHTML = Studio.html(h ? h[1] : (q.get('tool') || 'wallcal'), q.get('art')); Studio.mount(); };
    window.addEventListener('hashchange', render); render();
  });
}
</script></body></html>
