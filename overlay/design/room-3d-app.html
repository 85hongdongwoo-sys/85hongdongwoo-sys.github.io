:root{color-scheme:light;--bg:#f6f5f2;--card:#fff;--ink:#191817;--sub:#6d6a65;--line:#e7e4de;--clay:#b85c38;--ok:#2f6f55;--bad:#d23c2c}

 if(t.id==='rst'){if(t.dataset.sure!=='1'){t.dataset.sure='1';t.textContent='정말 처음부터?';return}pushUndo();S=fresh();selU=null;buildRoom();rebuildItems();setView('full');renderAll();toast('처음 상태로 돌아갔어요')}
 save();renderPanel()});
$('#pbody').addEventListener('input',e=>{if(e.target.id==='q'){F.q=e.target.value;F.n=30;const pos=e.target.selectionStart;renderPanel();const qi=$('#q');qi.focus();qi.setSelectionRange(pos,pos);return}const s=cur();if(e.target.id==='rw'){s.w=+e.target.value;$('#ow').textContent=s.w.toFixed(1)+'m'}else if(e.target.id==='rd'){s.d=+e.target.value;$('#od').textContent=s.d.toFixed(1)+'m'}else return;buildRoom();applyLight();refreshValid();save()});
$('#pbody').addEventListener('change',e=>{const t=e.target;if(t.type==='range')renderPanel();if(t.id==='fp'){F.p=t.value;F.n=30;renderPanel()}if(t.id==='fs'){F.sort=t.value;renderPanel()}if(t.id==='ff'){F.fit=t.checked;F.n=30;renderPanel()}});
function undo(){const st=undoStack.pop();if(!st)return;const k=S.cur;S=JSON.parse(st);selU=null;if(S.cur!==k)setView('full');buildRoom();rebuildItems();renderAll();save();$('#undo').disabled=!undoStack.length}
$('#undo').addEventListener('click',undo);$('#undo').disabled=true;
$('#shot').addEventListener('click',()=>{const v=selBox.visible;selBox.visible=selFill.visible=false;R.render(scene,cam);$('#shotImg').src=canvas.toDataURL('image/png');selBox.visible=selFill.visible=v;$('#modal').classList.add('show')});
$('#mClose').addEventListener('click',()=>$('#modal').classList.remove('show'));$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')$('#modal').classList.remove('show')});
const vis=new Set();const io=new IntersectionObserver(es=>es.forEach(e=>e.isIntersecting?vis.add(e.target):vis.delete(e.target)),{root:$('#pbody'),rootMargin:'300px'});
let thq=null;function queueThumbs(){document.querySelectorAll('#pbody img[data-th]:not([data-ok])').forEach(im=>io.observe(im));if(thq)return;const step=()=>{const im=[...vis].find(x=>x.isConnected&&!x.dataset.ok)||null;if(!im){thq=null;return}im.src=thumb(im.dataset.th);im.dataset.ok=1;io.unobserve(im);vis.delete(im);thq=setTimeout(step,16)};thq=setTimeout(step,30)}
setInterval(()=>{if(!thq&&[...vis].some(x=>x.isConnected&&!x.dataset.ok))queueThumbs()},400);
function renderAll(){renderTabs();renderViews();renderPanel();renderTotal();prog()}

/* ---------- 시작 ---------- */
function resize(){const r=view.getBoundingClientRect();R.setSize(r.width,r.height,false);cam.aspect=r.width/Math.max(1,r.height);cam.updateProjectionMatrix()}
const ro=new ResizeObserver(resize);ro.observe(view);resize();
buildRoom();rebuildItems();setView(S.view||'full',true);renderAll();
const ease=t=>1-(1-t)**3;
R.setAnimationLoop(()=>{if(camAnim){camAnim.t=Math.min(1,camAnim.t+.045);const k=ease(camAnim.t);cam.position.lerpVectors(camAnim.from,camAnim.to,k);ctl.target.lerpVectors(camAnim.tf,camAnim.tt,k);if(camAnim.t>=1)camAnim=null}ctl.update();R.render(scene,cam)});
setTimeout(()=>{$('#load').style.opacity=0;setTimeout(()=>$('#load').remove(),500)},250);
window.__ok=1;
}
</script>
