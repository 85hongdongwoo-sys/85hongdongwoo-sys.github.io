name: nettest (temporary)
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - env:
          EX_KEY: ${{ secrets.EX_KEY }}
        run: |
          for p in locationinfo/locationinfoRest restinfo/restBestfoodList business/curStateStation; do
            echo "== $p"; curl -s -m 60 -w "\nHTTP %{http_code} %{time_total}s\n" "https://data.ex.co.kr/openapi/$p?key=$EX_KEY&type=json&numOfRows=5&pageNo=1" | head -c 400; echo
          done
