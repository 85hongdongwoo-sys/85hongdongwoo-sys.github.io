name: nettest (temporary)
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - env:
          EX_KEY: ${{ secrets.EX_KEY }}
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          echo "== browser UA"; curl -s -m 60 -A "$UA" -H "Accept: application/json,text/html" -w "\nHTTP %{http_code}\n" "https://data.ex.co.kr/openapi/locationinfo/locationinfoRest?key=$EX_KEY&type=json&numOfRows=3&pageNo=1" | head -c 300; echo
          echo "== http"; curl -s -m 60 -A "$UA" -w "\nHTTP %{http_code}\n" "http://data.ex.co.kr/openapi/locationinfo/locationinfoRest?key=$EX_KEY&type=json&numOfRows=3&pageNo=1" | head -c 300; echo
          echo "== main page UA"; curl -s -m 30 -A "$UA" -o /dev/null -w "HTTP %{http_code}\n" https://data.ex.co.kr/
          echo "== ip"; curl -s -m 10 https://ipinfo.io/country
