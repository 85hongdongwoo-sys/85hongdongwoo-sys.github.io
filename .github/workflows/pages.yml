name: Deploy honglife.co.kr
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'   # 매시간: 공공데이터(응급실·대기질 등) 새로고침
    - cron: '47 23,0-8 * * *'   # 한국 오전 8시~오후 6시 사이 매시 47분: 전기차 충전소만 추가 갱신(30분 간격)
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false   # 공공데이터 첫 수집이 길어 취소되지 않게 차례로 실행
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Unpack tools site (includes redirect pages for old URLs)
        run: |
          mkdir -p _site
          cat tpkg/tools.tar.gz.part* | tar -xzf - -C _site
          echo "files: $(find _site -type f | wc -l)"
      - name: Apply overlay (여행픽 page) and add 입시·여행 to the menu
        run: |
          cp -r overlay/. _site/
          python3 build/patch_site.py _site
          python3 build/exams/gen_exams.py _site
          python3 build/exams/gen_exams_more.py _site || true
          python3 build/pwa/gen_pwa.py _site
          python3 build/deepen_pages.py _site || true   # 노출 있는 기존 페이지 보강 (목차·예시·표·FAQ)
          python3 build/unique/inject.py _site || true   # 서로 비슷한 페이지에 회사·프로그램별 고유 본문 (유사도 낮추기)
          python3 build/patch_datemod.py _site https://honglife.co.kr
      - name: Fetch public data (약국·응급실·충전소·주차장·화장실·대기질·축제·캠핑·주유소·휴게소)
        continue-on-error: true
        timeout-minutes: 25
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          OPINET_KEY: ${{ secrets.OPINET_KEY }}
          EX_KEY: ${{ secrets.EX_KEY }}
          PUB_FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
          EV_ONLY: ${{ github.event.schedule == '47 23,0-8 * * *' && '1' || '' }}
        run: |
          if [ -n "$OPINET_KEY" ]; then pip install -q pyproj; fi
          python3 build/pubdata/fetch.py _site
      - name: 국가교통정보센터 CCTV·돌발상황 넣기 (data-its 브랜치, 3시간마다 갱신)
        continue-on-error: true
        run: |
          mkdir -p _site/data/its
          if git fetch -q --depth 1 origin data-its; then git archive FETCH_HEAD | tar -x -C _site/data/its; fi
      - name: 공공데이터 지도 10종에 지역별 현황 표·사용법 글 넣기
        continue-on-error: true
        run: python3 build/pubdata/summary.py _site
      - name: 전국 급식 랭킹 데이터 넣기 (data-meal 브랜치)
        continue-on-error: true
        run: |
          mkdir -p _site/data/meal
          if git fetch -q --depth 1 origin data-meal; then git archive FETCH_HEAD | tar -x -C _site/data/meal; fi
          python3 build/meal/render_meal.py _site
      - name: 잠시 숨기기 (여행 카테고리·유료 미대 컨설팅) — build/hide_sections.py 의 HIDE 로 켜고 꺼요
        run: python3 build/hide_sections.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: 업로드 파일이 GitHub에 등록될 때까지 잠깐 기다리기
        run: sleep 45
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
