name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          pip install -q openpyxl && python3 build/exams/scrape_csat.py
          python3 -c "
          import json;d=json.load(open('build/exams/data/csat_grades.json'))
          for y in ['2017','2020','2022']:
            for k,v in d.get(y,{}).items():
              print('##',y,k,list(v['subjects']))
            print(json.dumps(d.get(y,{}).get('수능',{}).get('subjects',{}),ensure_ascii=False)[:1500])
          "
