name: Make shorts narration
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  narr:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: |
          pip install --upgrade pip
          pip install torch==2.2.2 torchaudio==2.2.2 --index-url https://download.pytorch.org/whl/cpu
          pip install git+https://github.com/myshell-ai/MeloTTS.git
          python -m unidic download
      - run: python build/voice/make_narr.py /tmp/narr
      - run: |
          cd /tmp/narr && git init -q -b narr-out && git add . && git -c user.name=voice-bot -c user.email=noreply@github.com commit -qm narr
          git push -f https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git narr-out
