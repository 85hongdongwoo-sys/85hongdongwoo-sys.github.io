name: muse-fetch
on:
  push:
    branches: [muse-data]
    paths: ['scripts/**', '.github/workflows/muse-fetch.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fetch_aic.py
      - run: |
          git config user.name "muse-bot"; git config user.email "actions@users.noreply.github.com"
          git add art && git commit -m "muse: fetch CC0 artworks from Art Institute of Chicago" && git push || echo nothing
