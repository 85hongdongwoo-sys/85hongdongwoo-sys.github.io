name: Driver data (LG official lists)
on:
  workflow_dispatch:
  schedule:
    - cron: '13 19 * * 0'   # 매주 월요일 04:13 KST — LG 그램·모니터 모델/파일 목록 새로 받기
permissions:
  contents: write
concurrency:
  group: driver-data
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Fetch LG model and file lists
        run: python3 build/newpages/fetch_lg.py /tmp/lg_models.json
      - name: Rebuild LG pages and commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898583+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main   # 최신 상태 위에서 다시 만들어 충돌 없이 올림
            cp /tmp/lg_models.json build/newpages/data/lg_models.json
            python3 build/newpages/driver_lg.py
            git add build/newpages/data/lg_models.json overlay/driver overlay/en/driver
            if git diff --cached --quiet; then echo "no change"; exit 0; fi
            git commit -q -m "LG 드라이버 목록 자동 갱신"
            if git push -q origin HEAD:main; then echo pushed; exit 0; fi
            sleep 10
          done
          exit 1
