name: Make navi voice clips
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: |
          pip install --upgrade pip
          pip install torch==2.2.2 torchaudio==2.2.2 --index-url https://download.pytorch.org/whl/cpu
          pip install git+https://github.com/myshell-ai/MeloTTS.git
          python -m unidic download
      - run: python build/voice/make_voice.py overlay/assets/voice/ko
      - run: |
          git config user.name "voice-bot"
          git config user.email "noreply@github.com"
          git add overlay/assets/voice
          git commit -m "노선 내비 안내 음성(MeloTTS) 생성" || echo "no change"
          git pull --rebase origin main
          git push origin HEAD:main
