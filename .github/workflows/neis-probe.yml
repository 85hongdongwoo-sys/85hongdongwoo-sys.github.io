name: neis-probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -m 30 "https://open.neis.go.kr/hub/mealServiceDietInfo?Type=json&pIndex=1&pSize=100&ATPT_OFCDC_SC_CODE=E10&SD_SCHUL_CODE=7310207&MLSV_FROM_YMD=20261116&MLSV_TO_YMD=20261120" | head -c 3000; echo
          python3 - <<'PY'
          import json,time,urllib.request as u
          def g(url): return json.loads(u.urlopen(url,timeout=30).read())
          codes=[]
          for p in (1,2):
              j=g(f"https://open.neis.go.kr/hub/schoolInfo?Type=json&pIndex={p}&pSize=100&ATPT_OFCDC_SC_CODE=E10")
              codes+=[r['SD_SCHUL_CODE'] for r in j['schoolInfo'][1]['row']]
          t=time.time();ok=0;err={}
          for c in codes[:150]:
              try:
                  j=g(f"https://open.neis.go.kr/hub/mealServiceDietInfo?Type=json&pIndex=1&pSize=100&ATPT_OFCDC_SC_CODE=E10&SD_SCHUL_CODE={c}&MLSV_FROM_YMD=20261116&MLSV_TO_YMD=20261120")
                  if 'mealServiceDietInfo' in j: ok+=1
                  else: k=j.get('RESULT',{}).get('CODE');err[k]=err.get(k,0)+1
              except Exception as e: err[str(e)[:40]]=err.get(str(e)[:40],0)+1
          print('150 calls',round(time.time()-t,1),'s ok',ok,err)
          PY
