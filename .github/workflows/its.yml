name: 국가교통정보센터 CCTV·돌발상황 (노선 내비)
on:
  workflow_dispatch:
  schedule:
    - cron: '13 */3 * * *'   # 3시간마다 — 한 번에 3회 호출 × 하루 8번 × 30일 ≈ 720회 (월 1,000회 한도 안)
permissions:
  contents: write
concurrency: {group: its, cancel-in-progress: false}
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: CCTV·돌발상황 받기
        env:
          ITS_KEY: ${{ secrets.ITS_KEY }}
        run: python3 build/its/fetch_its.py its-out
      - name: data-its 브랜치에 올리기 (기록 없이 덮어쓰기)
        run: |
          [ -d its-out/data/its ] && [ -n "$(ls its-out/data/its)" ] || { echo "데이터 없음 — 건너뜀"; exit 0; }
          cd its-out/data/its
          git init -q -b data-its
          git config user.name "its-bot"; git config user.email "its-bot@users.noreply.github.com"
          git add -A && git commit -qm "ITS $(date -u +%FT%H:%M)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data-its
