name: exam-probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (honglife.co.kr exam-link index)"
          for g in 08 59 05 22 52 31; do curl -s -m 40 -A "$UA" "https://www.q-net.or.kr/cst003.do?id=cst00309&gSite=L&gId=$g" -o p.html; echo "$g $(grep -o 'code=[0-9]*' p.html | head -1) $(grep -o "getGlobalParams('L','$g', '[^']*')" p.html | head -1)"; done
          curl -s -m 40 -A "$UA" "https://www.q-net.or.kr/cst003.do?id=cst00301s01&gSite=L&gId=59&gName=x&page=1&schText=&schType=&boardId=Q004&code=$(curl -s -A "$UA" "https://www.q-net.or.kr/cst003.do?id=cst00309&gSite=L&gId=59" | grep -o 'code=[0-9]*' | head -1 | cut -d= -f2)" | grep -o "goNext('[0-9]*'[^>]*>[^<]*" | head -5
