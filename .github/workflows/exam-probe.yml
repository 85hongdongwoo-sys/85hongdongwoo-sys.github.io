name: exam-probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (honglife.co.kr exam-link index)"
          B=https://gongmuwon.gosi.kr
          for u in "/aexm/docsscan/2026/08_68/crans/%EA%B1%B4%EC%B6%95%EA%B3%84%ED%9A%8D_%EA%B0%80.pdf" ; do
            curl -s -m 60 -A "$UA" -D h.txt "$B$u" -o f.bin; head -8 h.txt; ls -la f.bin; file f.bin; done
          sudo apt-get install -qq -y poppler-utils >/dev/null 2>&1; pdftotext -l 2 f.bin - 2>/dev/null | head -30; pdfinfo f.bin | grep Pages
          grep -o 'raonk[^"'"'"' ]*' -i <(curl -s -A "$UA" "$B/oprut/EvmArChcPrblmCransSbjctInqSbjctLst.do") | sort -u | head
