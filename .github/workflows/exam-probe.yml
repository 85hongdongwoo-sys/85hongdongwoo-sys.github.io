name: exam-probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (honglife.co.kr exam-link index)"
          B=https://gongmuwon.gosi.kr
          curl -s -m 40 -A "$UA" -c cj -b cj "$B/oprut/EvmArChcPrblmCransSbjctInqSbjctLst.do" -o c.html
          python3 - <<'PY'
          import re;s=open('c.html',encoding='utf-8',errors='replace').read()
          i=s.find('function fn_searchsubjectArea');print(re.sub(r'[ \t]+',' ',s[i:i+4000]))
          f=re.search(r'(?s)<form[^>]*id="frm".*?</form>',s).group(0)
          for m in re.findall(r'(?is)<(?:select|input)[^>]*name="[^"]+"[^>]*>',f): print('FIELD',m[:200])
          for m in re.findall(r'(?is)<input[^>]*type="radio"[^>]*>\s*<label[^>]*>[^<]*',f)[:40]: print('RADIO',re.sub(r'\s+',' ',m)[:200])
          PY
