name: exam-probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (honglife.co.kr exam-link index)"
          B=https://gongmuwon.gosi.kr
          curl -s -m 40 -A "$UA" -c cj -b cj "$B/oprut/EvmArPrblmCransGdLst.do" -o g.html
          python3 - <<'PY'
          import re;s=open('g.html',encoding='utf-8',errors='replace').read()
          f=re.search(r'(?s)<form[^>]*id="frm".*?</form>',s); print(re.findall(r'<input[^>]*type="hidden"[^>]*>',f.group(0)) if f else 'nofrm')
          PY
          curl -s -m 40 -A "$UA" -c cj -b cj -d "pstId=6026&bbsId=BBSMSTR_000000000138" "$B/oprut/EvmArPrblmCransGdDtl.do" -o d.html; wc -c d.html
          python3 - <<'PY'
          import re;s=open('d.html',encoding='utf-8',errors='replace').read()
          t=re.sub(r'<script.*?</script>|<style.*?</style>','',s,flags=re.S);t=re.sub(r'<[^>]+>',' ',t);t=re.sub(r'\s+',' ',t)
          i=t.find('시험종류');print(t[i:i+1200])
          print(sorted(set(re.findall(r'(?:href|onclick)="[^"]{0,300}"',s)))[:60])
          for m in re.finditer(r'(?is)function\s+(fn_\w*[Ff]ile\w*|fn_\w*[Dd]own\w*)\s*\([^)]*\)\s*\{.*?\}',s): print('FUNC',re.sub(r'\s+',' ',m.group(0))[:600])
          PY
          curl -s -m 40 -A "$UA" -c cj -b cj -d "hdn_curr_page=2&testSeCd=EXAM03&sGubun=&sKeyword=" "$B/oprut/EvmArPrblmCransGdLst.do" -o g2.html
          python3 - <<'PY'
          import re;s=open('g2.html',encoding='utf-8',errors='replace').read()
          for a,b in re.findall(r"fn_egov_inqire_notice\('(\d+)','[^']+'\)\"[^>]*>\s*([^<]+)",s)[:12]: print(a,b.strip())
          print(re.findall(r'goPage\((\d+)\)',s)[-3:])
          PY
