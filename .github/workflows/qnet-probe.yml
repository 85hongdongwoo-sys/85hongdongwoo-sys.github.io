name: qnet-probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (HongLifeTools)"
          curl -s -m 40 -A "$UA" "https://www.q-net.or.kr/anc002.do?gSite=Q&id=anc00201" -o a.html
          python3 - <<'PY'
          import re;s=open('a.html',encoding='utf-8',errors='replace').read()
          print(len(s))
          for m in re.finditer(r'(?s)<script[^>]*>(.*?)</script>',s):
              b=m.group(1)
              if re.search(r'정답|answer|anc00',b,re.I): print('SCRIPT:',re.sub(r'\s+',' ',b)[:2500])
          t=re.sub(r'<script.*?</script>|<style.*?</style>','',s,flags=re.S);t=re.sub(r'<[^>]+>',' ',t);t=re.sub(r'\s+',' ',t)
          i=t.find('최종정답 공개');print(t[i:i+2500])
          print(sorted(set(re.findall(r'onclick="[^"]{0,160}"',s)))[:40])
          PY
