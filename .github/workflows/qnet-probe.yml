name: qnet-probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (HongLifeTools)"
          for b in "Q004&code=1008" "Q008&code=1008" "Q008" "Q120"; do
            curl -s -m 40 -A "$UA" -H "X-Requested-With: XMLHttpRequest" -e "https://www.q-net.or.kr/cst003.do?id=cst00309&gSite=L&gId=08" "https://www.q-net.or.kr/cst003.do?id=cst00301s01&gSite=L&gId=08&gName=%EA%B3%B5%EC%9D%B8%EC%A4%91%EA%B0%9C%EC%82%AC&page=1&schText=&schType=&boardId=$b" -o x.html
            echo "== $b $(wc -c < x.html)"; python3 -c "
          import re;s=open('x.html',encoding='utf-8',errors='replace').read()
          t=re.sub(r'\s+',' ',re.sub(r'<[^>]+>',' | ',s));print(t[:1800]);print(re.findall(r'goView\([^)]*\)|goDetail\([^)]*\)|fn\w+\(\s*\'?\d{5,}[^)]*\)',s)[:8])"; done
          curl -s -m 40 -A "$UA" "https://www.q-net.or.kr/cst003.do?id=cst00308&gSite=L&gId=08" -o y.html; python3 -c "
          import re;s=open('y.html',encoding='utf-8',errors='replace').read();print(re.findall(r'<title>[^<]*',s), re.findall(r'boardId=Q\d+[^\"\']{0,40}',s)[:5])"
