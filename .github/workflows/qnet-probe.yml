name: qnet-probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (HongLifeTools)"
          L="https://www.q-net.or.kr/cst003.do?id=cst00301s01&gSite=L&gId=08&gName=x&page=1&schText=&schType=&boardId=Q004&code=1008"
          curl -s -m 40 -A "$UA" "$L" -o x.html
          python3 - <<'PY'
          import re;s=open('x.html',encoding='utf-8',errors='replace').read()
          i=s.find('2026년 제37회');print(s[i-1200:i+100])
          PY
          curl -s -m 40 -A "$UA" "https://www.q-net.or.kr/anc002.do?id=anc00201&gSite=L&gId=08" -o a.html
          python3 - <<'PY'
          import re;s=open('a.html',encoding='utf-8',errors='replace').read()
          t=re.sub(r'\s+',' ',re.sub(r'<script.*?</script>','',s,flags=re.S));t=re.sub(r'<[^>]+>',' | ',t);t=re.sub(r'(\|\s*)+','| ',t)
          i=t.find('정답');print(t[i-300:i+2500])
          print(sorted(set(re.findall(r'anc00\d\.do\?[^"\'\s<>]{0,120}|fn\w+\([^)]{0,80}\)',s)))[:40])
          PY
