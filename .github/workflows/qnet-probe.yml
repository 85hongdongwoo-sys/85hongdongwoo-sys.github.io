name: qnet-probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (HongLifeTools)"
          curl -s -m 40 -A "$UA" "https://www.q-net.or.kr/cst003.do?id=cst00302&gSite=L&gId=08&artlSeq=5212459&boardId=Q004" -o d.html; wc -c d.html
          grep -o -i '[^"]*\(file\|down\|attach\)[^"]*' d.html | sort -u | head -40
          python3 -c "
          import re;s=open('d.html',encoding='utf-8',errors='replace').read()
          for m in re.finditer(r'(?is)<a[^>]+>[^<]*(zip|pdf)[^<]*</a>',s): print(m.group(0)[:400])
          i=s.find('첨부'); print(s[i-200:i+1500])"
          echo ==== list
          curl -s -m 40 -A "$UA" "https://www.q-net.or.kr/cst003.do?id=cst00309&gSite=L&gId=08" -o l.html; wc -c l.html
          python3 -c "
          import re;s=open('l.html',encoding='utf-8',errors='replace').read()
          print(set(re.findall(r'artlSeq=\d+[^\"\']*',s)) and list(set(re.findall(r'artlSeq=\d+[^\"\']{0,80}',s)))[:5])
          for m in re.findall(r'(?s)<td[^>]*class=\"[^\"]*tit[^\"]*\"[^>]*>(.*?)</td>',s)[:5]: print(re.sub(r'\s+',' ',m)[:300])
          i=s.find('공인중개사 자격시험');print(s[i-800:i+400])"
