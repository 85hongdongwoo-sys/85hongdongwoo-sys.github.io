name: qnet-probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (HongLifeTools)"
          curl -s -m 60 -A "$UA" "https://www.q-net.or.kr/cst003.do?id=cst00302&gSite=L&gId=08&artlSeq=5212459&boardId=Q004&menuType=cst00309" -o d.html
          python3 - <<'PY'
          import re;s=open('d.html',encoding='utf-8',errors='replace').read()
          for k in ('목록','이전글','다음글','goList','fnList','pageIndex','boardId','정답'):
              for m in re.finditer(k,s):
                  print(k,'::',re.sub(r'\s+',' ',s[max(0,m.start()-250):m.start()+250]));break
          print(sorted(set(re.findall(r'[a-zA-Z0-9_]+\.do\?[^"\'\s<>]{0,200}',s)))[:60])
          PY
          for u in "cst003.do?id=cst00309&gSite=L&gId=08&boardId=Q004" "cst003.do?id=cst00309s01&gSite=L&gId=08&boardId=Q004&pageIndex=1" "cst003.do?id=cst00302s02&gSite=L&gId=08&boardId=Q004&pageIndex=1"; do
            curl -s -m 40 -A "$UA" "https://www.q-net.or.kr/$u" -o x.html; echo "== $u $(wc -c < x.html)"; python3 -c "
          import re;s=open('x.html',encoding='utf-8',errors='replace').read();print(re.findall(r'artlSeq[^\"\'<]{0,60}',s)[:6]);print(re.sub(r'\s+',' ',re.sub(r'<[^>]+>',' ',s))[:600])"; done
