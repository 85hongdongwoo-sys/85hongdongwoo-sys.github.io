name: qnet-probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (HongLifeTools)"
          curl -s -m 60 -A "$UA" -c cj -b cj "https://www.q-net.or.kr/cst003.do?id=cst00302&gSite=L&gId=08&artlSeq=5212459&boardId=Q004" -o /dev/null
          curl -s -m 120 -A "$UA" -c cj -b cj -G "https://www.q-net.or.kr/cst003.do" --data-urlencode "id=cst00302s01" --data-urlencode "gSite=L" --data-urlencode "gId=08" --data-urlencode "fileCode=R001" --data-urlencode "filePath=bbs/Q004/Q004_2208340" --data-urlencode "fileName=2023년 제34회 시험문제지.zip" --data-urlencode "fileSeq=2208340" -o f.bin -D h.txt; head -20 h.txt; ls -la f.bin; file f.bin; unzip -l f.bin 2>&1 | head -20
          echo ==== list
          grep -o 'cst003\.do[^"'"'"' ]*' l.html 2>/dev/null | head
          curl -s -m 40 -A "$UA" "https://www.q-net.or.kr/cst003.do?id=cst00309&gSite=L&gId=08" -o l.html
          python3 - <<'PY'
          import re;s=open('l.html',encoding='utf-8',errors='replace').read()
          print(sorted(set(re.findall(r'cst003\.do\?[^"\'\s<>]{0,160}',s)))[:30])
          print(re.findall(r'(?is)<form[^>]*>',s)[:5])
          print(sorted(set(re.findall(r'fn\w*\([^)]{0,80}\)',s)))[:30])
          i=s.find('tbody');print(re.sub(r'\s+',' ',s[i:i+3000]))
          PY
