name: qnet-probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (HongLifeTools)"
          curl -s -m 40 -A "$UA" "https://www.q-net.or.kr/anc002.do?gSite=Q&id=anc00201" -o a.html
          python3 - <<'PY' > gids.txt
          import re;s=open('a.html',encoding='utf-8',errors='replace').read()
          i=s.find('클릭하시면 해당 전문자격');seg=s[i:i+30000]
          for m in re.finditer(r'<a[^>]+href="([^"]+)"[^>]*>\s*([^<]{2,30})</a>',seg):
              g=re.search(r'gId=(\d+)',m.group(1))
              if g: print(g.group(1),m.group(2).strip())
          PY
          cat gids.txt
          while read g n; do
            curl -s -m 40 -A "$UA" "https://www.q-net.or.kr/cst003.do?id=cst00301s01&gSite=L&gId=$g&gName=x&page=1&schText=&schType=&boardId=Q004&code=10$g" -o x.html
            python3 -c "
          import re,sys;s=open('x.html',encoding='utf-8',errors='replace').read()
          t=re.findall(r\"goNext\('(\d+)'[^>]*>([^<]+)<\",s);print('##','$g','$n',len(t));[print('   ',a,b.strip()) for a,b in t[:6]]"
          done < gids.txt
          curl -s -m 120 -A "$UA" -G "https://www.q-net.or.kr/cst003.do" --data-urlencode "id=cst00302s01" --data-urlencode "gSite=L" --data-urlencode "gId=08" --data-urlencode "fileCode=R001" --data-urlencode "filePath=bbs/Q004/Q004_2270826" --data-urlencode "fileName=x.zip" --data-urlencode "fileSeq=2270826" -o f.zip; unzip -l -O cp949 f.zip
