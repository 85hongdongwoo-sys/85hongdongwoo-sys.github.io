name: qnet-probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (HongLifeTools)"
          for p in 1 2; do curl -s -m 40 -A "$UA" "https://www.q-net.or.kr/cst003.do?id=cst00302&gSite=L&gId=08&pageIndex=$p" -o l$p.html; done
          python3 - <<'PY'
          import re
          for f in ('l1.html','l2.html'):
              s=open(f,encoding='utf-8',errors='replace').read()
              rows=re.findall(r'artlSeq=(\d+)[^>]*>\s*(?:<[^>]+>\s*)*([^<]{4,120})',s)
              print(f,len(s),len(rows));[print(r) for r in rows[:25]]
              print(re.findall(r'total[^<]{0,60}',s)[:3])
          PY
          curl -s -m 120 -A "$UA" -G "https://www.q-net.or.kr/cst003.do" --data-urlencode "id=cst00302s01" --data-urlencode "gSite=L" --data-urlencode "gId=08" --data-urlencode "fileCode=R001" --data-urlencode "filePath=bbs/Q004/Q004_2208340" --data-urlencode "fileName=x.zip" --data-urlencode "fileSeq=2208340" -o f.zip
          mkdir z && cd z && unzip -q -O cp949 ../f.zip && ls; sudo apt-get install -qq -y poppler-utils >/dev/null 2>&1; f=$(ls | head -1); pdfinfo "$f" | head -5; pdftotext "$f" - | head -150; echo ===== RAW; pdftotext -raw "$f" - | sed -n 1,80p
