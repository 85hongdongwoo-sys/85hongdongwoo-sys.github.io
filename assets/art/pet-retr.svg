l="none" stroke-linecap="round" opacity="0.8"></path><path d="M60 -38l8 4" stroke="#EBC284" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8"></path><path d="M66 -44l8 4" stroke="#EBC284" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8"></path></g><ellipse cx="0" cy="-40" rx="42" ry="48" fill="#D9A35A" opacity="1" transform="rotate(0 0 -40)"></ellipse><ellipse cx="0" cy="-46" rx="26" ry="34" fill="#F2D6A2" opacity="0.85" transform="rotate(0 0 -46)"></ellipse><ellipse cx="18" cy="-28" rx="22" ry="32" fill="#B57E3A" opacity="0.55" transform="rotate(0 18 -28)"></ellipse><path d="M-14 -18l-2 10" stroke="#EBC284" stroke-width="2.4" fill="none" stroke-linecap="round" opacity="0.9"></path><path d="M-7 -18l-2 10" stroke="#EBC284" stroke-width="2.4" fill="none" stroke-linecap="round" opacity="0.9"></path><path d="M0 -18l-2 10" stroke="#EBC284" stroke-width="2.4" fill="none" stroke-linecap="round" opacity="0.9"></path><path d="M7 -18l-2 10" stroke="#EBC284" stroke-width="2.4" fill="none" stroke-linecap="round" opacity="0.9"></path><path d="M14 -18l-2 10" stroke="#EBC284" stroke-width="2.4" fill="none" stroke-linecap="round" opacity="0.9"></path><ellipse cx="-20" cy="0" rx="16" ry="9" fill="#D9A35A" opacity="1" transform="rotate(0 -20 0)"></ellipse><ellipse cx="18" cy="0" rx="16" ry="9" fill="#D9A35A" opacity="1" transform="rotate(0 18 0)"></ellipse><ellipse cx="-20" cy="-1" rx="9" ry="4" fill="#EBC284" opacity="0.8" transform="rotate(0 -20 -1)"></ellipse><ellipse cx="18" cy="-1" rx="9" ry="4" fill="#EBC284" opacity="0.8" transform="rotate(0 18 -1)"></ellipse><g class="head" style="transform-origin:50% 100%;animation-delay:-1.7s"><ellipse cx="0" cy="-104" rx="34" ry="32" fill="#D9A35A" opacity="1" transform="rotate(0 0 -104)"></ellipse><ellipse cx="-6" cy="-112" rx="20" ry="14" fill="#EBC284" opacity="0.6" transform="rotate(0 -6 -112)"></ellipse><g class="flap" style="transform-origin:80% 0%;"><path d="M-28 -116c-20 6 -22 40 -8 46c6 -12 10 -30 8 -46z" fill="#B57E3A" opacity="1"></path></g><g class="flap2" style="transform-origin:20% 0%;"><path d="M28 -116c20 6 22 40 8 46c-6 -12 -10 -30 -8 -46z" fill="#B57E3A" opacity="1"></path></g><path d="M-34 -96c-4 10 -4 18 0 24M34 -96c4 10 4 18 0 24" stroke="#9C6A2E" stroke-width="2.2" fill="none" stroke-linecap="round" opacity="0.7"></path><ellipse cx="0" cy="-88" rx="16" ry="13" fill="#F2D6A2" opacity="1" transform="rotate(0 0 -88)"></ellipse><ellipse cx="0" cy="-94" rx="6" ry="4.6" fill="#2B1E17" opacity="1" transform="rotate(0 0 -94)"></ellipse><ellipse cx="-1.5" cy="-95.5" rx="1.6" ry="1" fill="#6A5A50" opacity="1" transform="rotate(0 -1.5 -95.5)"></ellipse><g class="blink" style="animation-delay:-0.4s"><ellipse cx="-13" cy="-106" rx="4" ry="4.4" fill="#2B1E17" opacity="1" transform="rotate(0 -13 -106)"></ellipse><ellipse cx="13" cy="-106" rx="4" ry="4.4" fill="#2B1E17" opacity="1" transform="rotate(0 13 -106)"></ellipse><ellipse cx="-14.2" cy="-107.5" rx="1.4" ry="1.2" fill="#FFFFFF" opacity="1" transform="rotate(0 -14.2 -107.5)"></ellipse><ellipse cx="11.8" cy="-107.5" rx="1.4" ry="1.2" fill="#FFFFFF" opacity="1" transform="rotate(0 11.8 -107.5)"></ellipse></g><g class="pant" style="transform-origin:50% 0%;"><path d="M-6 -82c2 10 10 10 12 0z" fill="#E4848C" opacity="1"></path></g><path d="M-8 -84c4 4 12 4 16 0" stroke="#2B1E17" stroke-width="2" fill="none" stroke-linecap="round" opacity="1"></path></g></g></g></g></svg>