<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -150 140 160" width="140" height="160"><style>.tail,.head,.nod,.ear,.ear2,.flap,.flap2,.blink,.pant,.br{transform-box:fill-box}
.br{transform-origin:50% 100%;animation:br 3.2s ease-in-out infinite}
@keyframes br{0%,100%{transform:scale(1,1)}50%{transform:scale(1.02,1.05)}}
.tail{animation:wag 1.8s ease-in-out infinite}.tail.fast{animation-duration:.55s}.tail.slow{animation-duration:3.6s}
@keyframes wag{0%,100%{transform:rotate(0)}50%{transform:rotate(-16deg)}}
.blink{transform-origin:50% 50%;animation:blink 4.2s infinite}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}93%{transform:scaleY(.08)}96%{transform:scaleY(1)}}
.head{animation:tiltH 6.5s ease-in-out infinite}
@keyframes tiltH{0%,55%,100%{transform:rotate(0)}65%{transform:rotate(8deg)}80%{transform:rotate(8deg)}88%{transform:rotate(-3deg)}}
.nod{animation:nod 5s ease-in-out infinite}
@keyframes nod{0%,100%{transform:rotate(0)}50%{transform:rotate(3deg)}}
.ear,.ear2{transform-origin:50% 100%;animation:ear 5.5s infinite}.ear2{animation-delay:-2.7s}
@keyframes ear{0%,86%,100%{transform:rotate(0)}89%{transform:rotate(-14deg)}92%{transform:rotate(0)}95%{transform:rotate(-10deg)}98%{transform:rotate(0)}}
.flap,.flap2{animation:flap 1.1s ease-in-out infinite}.flap2{animation-direction:reverse}
@keyframes flap{0%,100%{transform:rotate(0)}50%{transform:rotate(5deg)}}
.pant{animation:pant .5s ease-in-out infinite}
@keyframes pant{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.35)}}
